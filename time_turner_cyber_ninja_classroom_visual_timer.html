<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIME TURNER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;800&family=Orbitron:wght@700;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Rajdhani', 'sans-serif'],
                        display: ['Orbitron', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    },
                    colors: {
                        dojo: {
                            950: '#050811',
                            900: '#0B1120',
                            850: '#0F172A',
                            800: '#162038'
                        }
                    }
                }
            }
        };
    </script>
    <style>
        body {
            background-color: #050811;
            color: #F1F5F9;
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
            background-image:
                radial-gradient(circle at 50% 0%, rgba(0, 229, 255, 0.08) 0%, transparent 55%),
                linear-gradient(rgba(0, 229, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 229, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 48px 48px, 48px 48px;
        }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #050811; }
        ::-webkit-scrollbar-thumb { background: #1E293B; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #00E5FF; }

        .hud-panel {
            background: #0B1120;
            border: 1px solid rgba(0, 229, 255, 0.22);
            box-shadow: 0 12px 32px -12px rgba(0, 0, 0, 0.85);
        }

        .clock-glow {
            box-shadow: 0 0 70px -15px rgba(0, 229, 255, 0.24), 0 24px 50px -15px rgba(0, 0, 0, 0.9);
        }

        .neon-cyan {
            text-shadow: 0 0 14px rgba(0, 229, 255, 0.45);
        }

        @keyframes screenPulse {
            0% { box-shadow: inset 0 0 0 0 rgba(0, 229, 255, 0); }
            30% { box-shadow: inset 0 0 90px 20px rgba(0, 229, 255, 0.6); }
            100% { box-shadow: inset 0 0 0 0 rgba(0, 229, 255, 0); }
        }
        .flash-cue { animation: screenPulse 1.1s ease-out; }

        @keyframes micPulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 42, 133, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(255, 42, 133, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 42, 133, 0); }
        }
        .mic-live { animation: micPulse 1.3s infinite; }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-cyan-400 selection:text-dojo-950">

    <!-- Visual Screen Border Pulse -->
    <div id="flash-overlay" class="fixed inset-0 pointer-events-none z-50"></div>

    <!-- ===================================================================== -->
    <!-- MODE 1: SETUP VIEW (CLEAN, COMPACT, LOW-TEXT)                         -->
    <!-- ===================================================================== -->
    <div id="setup-view" class="flex-1 flex flex-col">

        <!-- Minimal Top Bar -->
        <header class="border-b border-cyan-500/20 bg-dojo-900/90 backdrop-blur-md px-4 sm:px-6 py-3.5 sticky top-0 z-30">
            <div class="max-w-4xl mx-auto flex items-center justify-between gap-3">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-xl bg-cyan-500/15 border border-cyan-400/50 flex items-center justify-center text-cyan-300">
                        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 2L14.8 9.2L22 12L14.8 14.8L12 22L9.2 14.8L2 12L9.2 9.2L12 2Z"/>
                            <circle cx="12" cy="12" r="2" fill="currentColor"/>
                        </svg>
                    </div>
                    <h1 class="font-display font-black text-lg sm:text-xl tracking-wider text-white neon-cyan">
                        TIME TURNER
                    </h1>
                </div>

                <!-- Chime Dropdown + Test Icon + BROADCAST Button -->
                <div class="flex items-center gap-2 sm:gap-3">
                    <div class="flex items-center bg-dojo-950 border border-cyan-500/25 rounded-xl p-1">
                        <select id="chime-select" aria-label="Chime"
                            class="bg-transparent text-xs sm:text-sm font-display font-bold text-slate-200 px-2.5 py-1.5 focus:outline-none cursor-pointer">
                            <option value="Gong" class="bg-dojo-900">Gong</option>
                            <option value="Cyber" class="bg-dojo-900">Cyber</option>
                            <option value="Triad" class="bg-dojo-900">Triad</option>
                            <option value="Bowl" class="bg-dojo-900">Bowl</option>
                            <option value="Silent" class="bg-dojo-900">Silent</option>
                        </select>
                        <button type="button" id="btn-test-chime" title="Preview Chime"
                            class="w-8 h-8 rounded-lg hover:bg-cyan-500/20 text-cyan-300 flex items-center justify-center transition active:scale-90">
                            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M8 5v14l11-7z"/>
                            </svg>
                        </button>
                    </div>

                    <button type="button" id="btn-broadcast"
                        class="px-4 sm:px-5 py-2.5 rounded-xl bg-gradient-to-r from-cyan-400 to-emerald-400 hover:from-cyan-300 hover:to-emerald-300 text-dojo-950 font-display font-black text-xs sm:text-sm tracking-wider uppercase flex items-center gap-2 shadow-[0_0_22px_rgba(0,229,255,0.4)] transition active:scale-95">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/>
                        </svg>
                        <span>BROADCAST</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- Centered Setup Container -->
        <main class="flex-1 max-w-4xl w-full mx-auto px-4 sm:px-6 py-6 flex flex-col gap-5">

            <!-- Compact Time & AI Strip -->
            <section class="hud-panel rounded-2xl p-4 sm:p-5 flex flex-col gap-4">
                <div class="flex flex-wrap items-center justify-between gap-4">
                    <!-- Mini Pie + Total Minutes + Quick Pills -->
                    <div class="flex items-center gap-3.5 flex-wrap">
                        <div class="w-12 h-12 rounded-full bg-dojo-950 border border-cyan-400/40 p-0.5 shrink-0">
                            <svg id="mini-pie-svg" viewBox="0 0 100 100" class="w-full h-full rounded-full"></svg>
                        </div>

                        <div class="flex items-center gap-1.5 bg-dojo-950 border border-cyan-500/30 rounded-xl px-2.5 py-1.5">
                            <input id="total-minutes-input" type="number" min="1" max="180" value="45" aria-label="Total Minutes"
                                class="w-12 text-center font-mono font-extrabold text-lg bg-transparent text-white focus:outline-none">
                            <span class="text-xs font-display font-bold text-cyan-400">MIN</span>
                        </div>

                        <div class="flex items-center gap-1.5">
                            <button type="button" data-mins="20" class="quick-min px-2.5 py-1.5 rounded-lg bg-dojo-950 hover:bg-cyan-500/20 border border-slate-800 hover:border-cyan-400/50 font-mono font-bold text-xs text-slate-300 hover:text-cyan-200 transition">20m</button>
                            <button type="button" data-mins="30" class="quick-min px-2.5 py-1.5 rounded-lg bg-dojo-950 hover:bg-cyan-500/20 border border-slate-800 hover:border-cyan-400/50 font-mono font-bold text-xs text-slate-300 hover:text-cyan-200 transition">30m</button>
                            <button type="button" data-mins="45" class="quick-min px-2.5 py-1.5 rounded-lg bg-dojo-950 hover:bg-cyan-500/20 border border-slate-800 hover:border-cyan-400/50 font-mono font-bold text-xs text-slate-300 hover:text-cyan-200 transition">45m</button>
                            <button type="button" data-mins="60" class="quick-min px-2.5 py-1.5 rounded-lg bg-dojo-950 hover:bg-cyan-500/20 border border-slate-800 hover:border-cyan-400/50 font-mono font-bold text-xs text-slate-300 hover:text-cyan-200 transition">60m</button>
                        </div>
                    </div>

                    <!-- Subtle Allocation Ratio Pill -->
                    <div class="flex items-center gap-2">
                        <span id="allocation-pill" class="px-3 py-1 rounded-lg bg-dojo-950 border border-slate-800 font-mono font-bold text-xs text-emerald-400">
                            45 / 45m
                        </span>
                        <button type="button" id="btn-fit-mins" class="hidden px-2.5 py-1 rounded-lg bg-cyan-500/15 hover:bg-cyan-500/25 border border-cyan-400/40 font-display font-bold text-[11px] uppercase text-cyan-300 transition">
                            Fit
                        </button>
                    </div>
                </div>

                <!-- Single-Row AI Tip Generator Bar (Text + Mic + AI Tips Button) -->
                <div class="flex items-center gap-2 pt-3 border-t border-cyan-500/15">
                    <input id="ai-topic-input" type="text" placeholder="Lesson topic..."
                        class="flex-1 min-w-0 px-3.5 py-2.5 rounded-xl bg-dojo-950 border border-cyan-500/25 text-white placeholder-slate-500 text-sm sm:text-base font-semibold focus:outline-none focus:border-cyan-400">

                    <button type="button" id="btn-mic" title="Voice Input"
                        class="w-11 h-11 rounded-xl bg-dojo-950 hover:bg-fuchsia-500/20 border border-fuchsia-500/40 text-fuchsia-300 flex items-center justify-center shrink-0 transition active:scale-95">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8"/>
                        </svg>
                    </button>

                    <button type="button" id="btn-ai-tips"
                        class="px-4 py-2.5 rounded-xl bg-gradient-to-r from-fuchsia-600 to-cyan-500 hover:from-fuchsia-500 hover:to-cyan-400 text-white font-display font-extrabold text-xs uppercase tracking-wider flex items-center gap-1.5 shrink-0 shadow-[0_0_18px_rgba(255,42,133,0.28)] transition active:scale-95">
                        <span id="ai-icon">&#10024;</span>
                        <span id="ai-label">AI Tips</span>
                    </button>
                </div>
            </section>

            <!-- Compact Phases List -->
            <section id="phases-list" class="flex flex-col gap-3"></section>

            <!-- Bottom Add Phase Button -->
            <button type="button" id="btn-add-phase"
                class="w-full py-3 rounded-2xl border border-dashed border-cyan-500/35 hover:border-cyan-400 bg-dojo-900/50 hover:bg-cyan-500/10 text-cyan-300 font-display font-bold text-xs uppercase tracking-widest flex items-center justify-center gap-2 transition active:scale-[0.99]">
                <span class="text-base leading-none">+</span>
                <span>Add Phase</span>
            </button>
        </main>
    </div>

    <!-- ===================================================================== -->
    <!-- MODE 2: BROADCAST VIEW (ZERO-CLUTTER FULLSCREEN PROJECTION)           -->
    <!-- ===================================================================== -->
    <div id="broadcast-view" class="hidden min-h-screen flex-col justify-between p-4 sm:p-6 gap-4">

        <!-- Top Header: Active Phase Emoji + Large Title + Phase Pill + Big Countdown -->
        <header class="w-full max-w-[1600px] mx-auto hud-panel rounded-3xl px-5 sm:px-8 py-4 flex items-center justify-between gap-4">
            <div class="flex items-center gap-4 sm:gap-5 min-w-0 flex-1">
                <div id="bc-icon" class="w-16 h-16 sm:w-20 sm:h-20 rounded-2xl flex items-center justify-center text-4xl sm:text-5xl shrink-0 overflow-hidden bg-cyan-500/15 border-2 border-cyan-400">
                    &#128221;
                </div>
                <div class="min-w-0 flex-1">
                    <div class="flex items-center gap-2.5">
                        <span id="bc-pill" class="px-2.5 py-0.5 rounded-lg bg-dojo-950 border border-cyan-400/40 font-mono font-extrabold text-xs sm:text-sm text-cyan-300">
                            1 / 3
                        </span>
                    </div>
                    <h1 id="bc-title" class="font-display font-black text-white tracking-wide leading-tight truncate mt-1 neon-cyan"
                        style="font-size: clamp(2.2rem, 4.5vw, 4rem);">
                        Plan &amp; Outline
                    </h1>
                </div>
            </div>

            <div class="shrink-0 text-right bg-dojo-950 border border-cyan-400/40 rounded-2xl px-5 py-2.5">
                <div id="bc-countdown" class="font-mono font-extrabold text-4xl sm:text-5xl text-cyan-300 tabular-nums leading-none">
                    10:00
                </div>
            </div>
        </header>

        <!-- Main Split: Left (~55%) Round Pie Clock | Right (~45%) DO NOW Card -->
        <main class="flex-1 w-full max-w-[1600px] mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6 items-center">

            <!-- Left (~55% -> 7 cols): Analog Pie-Chart Visual Clock -->
            <section class="lg:col-span-7 flex flex-col items-center justify-center gap-3">
                <div id="clock-click-target" title="Click to toggle Full Pie / Disappearing Pie"
                    class="w-full max-w-[530px] aspect-square rounded-full hud-panel clock-glow p-3 sm:p-4 flex items-center justify-center cursor-pointer select-none transition-transform active:scale-[0.99]">
                    <svg id="clock-svg" viewBox="0 0 500 500" class="w-full h-full rounded-full overflow-visible">
                        <defs>
                            <radialGradient id="bezelGrad" cx="50%" cy="40%" r="65%">
                                <stop offset="0%" stop-color="#16223B"/>
                                <stop offset="100%" stop-color="#050811"/>
                            </radialGradient>
                            <filter id="handGlow" x="-40%" y="-40%" width="180%" height="180%">
                                <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#FF2A85" flood-opacity="0.9"/>
                            </filter>
                        </defs>

                        <!-- Outer Bezel -->
                        <circle cx="250" cy="250" r="246" fill="url(#bezelGrad)" stroke="#00E5FF" stroke-opacity="0.4" stroke-width="2"/>
                        <circle cx="250" cy="250" r="235" fill="#070C18" stroke="#00E5FF" stroke-opacity="0.18" stroke-width="1"/>

                        <!-- Pie Dial Base (Radius = 195) -->
                        <circle cx="250" cy="250" r="195" fill="#0F172A"/>

                        <!-- Wedges, Elapsed Sweep, Dividers, Labels, Ticks -->
                        <g id="wedges-layer"></g>
                        <g id="elapsed-layer"></g>
                        <g id="dividers-layer"></g>
                        <circle cx="250" cy="250" r="195" fill="none" stroke="#00E5FF" stroke-opacity="0.3" stroke-width="2" class="pointer-events-none"/>
                        <g id="labels-layer"></g>
                        <g id="ticks-layer"></g>

                        <!-- Katana Sweeping Clock Hand -->
                        <g id="hand-layer" filter="url(#handGlow)" class="pointer-events-none">
                            <line x1="250" y1="282" x2="250" y2="250" stroke="#00E5FF" stroke-width="7" stroke-linecap="round"/>
                            <polygon points="246.5,250 253.5,250 251,54 249,54" fill="#FF2A85"/>
                            <line x1="250" y1="248" x2="250" y2="60" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
                            <circle cx="250" cy="56" r="5" fill="#FF2A85" stroke="#FFFFFF" stroke-width="1.8"/>
                        </g>

                        <!-- Center Hub -->
                        <circle cx="250" cy="250" r="46" fill="#070C18" stroke="#00E5FF" stroke-width="2.5" class="pointer-events-none"/>
                        <text id="hub-time" x="250" y="251" text-anchor="middle" dominant-baseline="central"
                            class="font-mono font-extrabold fill-white tabular-nums pointer-events-none" style="font-size: 20px;">
                            10:00
                        </text>
                    </svg>
                </div>

                <!-- Subtle Sweep Mode Pill -->
                <button type="button" id="btn-sweep-pill"
                    class="px-3 py-1 rounded-full bg-dojo-900 border border-cyan-500/25 font-display font-bold text-[11px] uppercase tracking-wider text-cyan-300 hover:border-cyan-400 transition">
                    &#9684; Full Pie
                </button>
            </section>

            <!-- Right (~45% -> 5 cols): Clean DO NOW Card + NEXT Footer Strip -->
            <aside class="lg:col-span-5 hud-panel rounded-3xl p-6 sm:p-7 flex flex-col justify-between gap-5 h-full max-h-[620px]">
                <div class="flex flex-col gap-4 overflow-y-auto">
                    <div class="flex items-center gap-2.5 border-b border-cyan-500/20 pb-3">
                        <span class="w-3 h-3 rounded-full bg-cyan-400 shadow-[0_0_8px_#00E5FF]"></span>
                        <h2 class="font-display font-black text-lg sm:text-xl tracking-widest uppercase text-cyan-300">
                            DO NOW
                        </h2>
                    </div>

                    <ul id="bc-do-now-list" class="flex flex-col gap-3"></ul>
                </div>

                <!-- Compact NEXT Footer Strip -->
                <div class="bg-dojo-950 rounded-2xl px-4 py-3 border border-cyan-500/20 flex items-center justify-between gap-3 shrink-0">
                    <div class="flex items-center gap-3 min-w-0">
                        <span class="font-display font-extrabold text-xs uppercase tracking-widest text-cyan-400 shrink-0">NEXT</span>
                        <span id="bc-next-icon" class="text-2xl shrink-0">&#128187;</span>
                        <span id="bc-next-title" class="font-bold text-lg sm:text-xl text-white truncate">Draft</span>
                    </div>
                    <span id="bc-next-mins" class="font-mono font-bold text-sm text-slate-400 shrink-0">25m</span>
                </div>
            </aside>
        </main>

        <!-- Minimal Floating Bottom Dock -->
        <footer class="w-full max-w-[1600px] mx-auto flex justify-center">
            <div class="hud-panel rounded-2xl px-3 py-2 flex flex-wrap items-center justify-center gap-1.5 sm:gap-2">
                <button type="button" id="dock-reset" class="px-3 py-2 rounded-xl bg-dojo-950 hover:bg-dojo-800 border border-slate-800 font-display font-bold text-xs uppercase text-slate-300 transition active:scale-95">Reset</button>
                <button type="button" id="dock-sub1" class="px-3 py-2 rounded-xl bg-dojo-950 hover:bg-dojo-800 border border-slate-800 font-mono font-extrabold text-xs text-slate-300 transition active:scale-95">-1m</button>
                <button type="button" id="dock-play" class="px-6 py-2.5 rounded-xl bg-gradient-to-r from-emerald-400 to-cyan-400 hover:from-emerald-300 hover:to-cyan-300 text-dojo-950 font-display font-black text-xs sm:text-sm uppercase tracking-wider min-w-[120px] transition active:scale-95">Start</button>
                <button type="button" id="dock-add1" class="px-3 py-2 rounded-xl bg-dojo-950 hover:bg-dojo-800 border border-slate-800 font-mono font-extrabold text-xs text-amber-300 transition active:scale-95">+1m</button>
                <button type="button" id="dock-next" class="px-3 py-2 rounded-xl bg-dojo-950 hover:bg-dojo-800 border border-slate-800 font-display font-bold text-xs uppercase text-slate-200 transition active:scale-95">Next</button>
                <button type="button" id="dock-sound" class="px-3 py-2 rounded-xl bg-dojo-950 hover:bg-dojo-800 border border-slate-800 font-display font-bold text-xs uppercase text-cyan-300 transition active:scale-95">Sound</button>
                <button type="button" id="dock-exit" class="px-3 py-2 rounded-xl bg-rose-500/15 hover:bg-rose-500/25 border border-rose-500/40 font-display font-bold text-xs uppercase text-rose-200 transition active:scale-95">Exit</button>
            </div>
        </footer>
    </div>

    <!-- ===================================================================== -->
    <!-- EMOJI (42 CATEGORIZED) & IMAGE UPLOAD MODAL                           -->
    <!-- ===================================================================== -->
    <div id="emoji-modal" class="fixed inset-0 bg-dojo-950/80 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <div class="hud-panel rounded-3xl max-w-md w-full p-5 flex flex-col gap-4 max-h-[85vh] overflow-y-auto">
            <div class="flex items-center justify-between">
                <span class="font-display font-bold text-xs uppercase tracking-widest text-cyan-300">Icon / Photo</span>
                <button type="button" id="btn-close-modal" class="w-7 h-7 rounded-full bg-dojo-950 border border-slate-800 text-slate-400 hover:text-white text-xs font-bold">&#10005;</button>
            </div>

            <div id="emoji-categories-box" class="flex flex-col gap-3 max-h-60 overflow-y-auto pr-1"></div>

            <div class="border-t border-slate-800 pt-3 flex items-center gap-2">
                <input id="custom-tag-input" type="text" maxlength="5" placeholder="Tag..."
                    class="flex-1 px-3 py-2 rounded-xl bg-dojo-950 border border-slate-800 text-white text-sm font-bold focus:outline-none focus:border-cyan-400">
                <button type="button" id="btn-use-tag" class="px-3.5 py-2 rounded-xl bg-cyan-400 text-dojo-950 font-display font-extrabold text-xs uppercase">Use</button>
                <label class="px-3.5 py-2 rounded-xl bg-dojo-950 hover:bg-cyan-500/15 border border-cyan-500/35 text-cyan-300 font-display font-bold text-xs uppercase cursor-pointer">
                    Photo
                    <input id="photo-upload-input" type="file" accept="image/*" class="hidden">
                </label>
            </div>
        </div>
    </div>

    <script>
        (function () {
            'use strict';

            // =================================================================
            // 1. CONSTANTS & STATE
            // =================================================================
            const STORAGE_KEY = 'time_turner_minimal_v1';

            const COLORS = [
                '#00E5FF', // Cyan
                '#00E676', // Emerald
                '#FFB300', // Amber
                '#FF2A85', // Magenta
                '#A855F7', // Violet
                '#38BDF8'  // Sky
            ];

            const EMOJI_GROUPS = [
                { name: 'Write', items: ['📝', '✏️', '📋', '🗂️', '🧠', '💡'] },
                { name: 'Read', items: ['📖', '📚', '🔍', '📰', '🔖', '🧐'] },
                { name: 'STEM', items: ['💻', '🖥️', '🔬', '🧪', '🧮', '⚙️'] },
                { name: 'Talk', items: ['🗣️', '🤝', '💬', '🙋', '👥', '🎤'] },
                { name: 'Create', items: ['🎨', '✂️', '🖌️', '🎭', '🎵', '🏗️'] },
                { name: 'Focus', items: ['⏳', '⏰', '🎯', '⚡', '🧘', '🌿'] },
                { name: 'Wrap', items: ['✅', '🧹', '🎒', '🏆', '🌟', '🔔'] }
            ];

            const state = {
                totalMinutes: 45,
                chime: 'Gong',
                topic: '',
                segments: [
                    {
                        id: 'p1',
                        title: 'Plan & Outline',
                        icon: '📝',
                        imageUrl: null,
                        minutes: 10,
                        color: '#00E5FF',
                        tips: ['Open graphic organizer', 'Write main thesis claim', 'List 3 key facts']
                    },
                    {
                        id: 'p2',

            // =================================================================

            function loadState() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (!raw) return;
                    const data = JSON.parse(raw);
                    if (data && Array.isArray(data.segments) && data.segments.length) {
                        state.totalMinutes = Math.max(1, Math.min(180, Number(data.totalMinutes) || 45));
                        state.chime = data.chime || 'Gong';
                        state.topic = data.topic || '';
                        state.segments = data.segments;
                        state.sweepMode = data.sweepMode === 'vanish' ? 'vanish' : 'full';
                        state.muted = Boolean(data.muted);
                    }
                } catch (e) {}
            }

            function saveState() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify({
                        totalMinutes: state.totalMinutes,
                        chime: state.chime,
                        topic: state.topic,
                        segments: state.segments,
                        sweepMode: state.sweepMode,
                        muted: state.muted
                    }));
                } catch (e) {}
            }

            // 4. SETUP VIEW RENDERING
            // =================================================================

                return state.segments.reduce((sum, s) => sum + Math.max(0, Number(s.minutes) || 0), 0);

            function setTotalMinutes(val) {
                state.totalMinutes = Math.max(1, Math.min(180, Math.round(Number(val) || 1)));
                const input = document.getElementById('total-minutes-input');
                if (input) input.value = state.totalMinutes;

                    state.elapsedSeconds = state.totalMinutes * 60;

            function addPhase() {
                const rem = state.totalMinutes - getAllocatedMinutes();
                const mins = rem > 0 ? Math.min(10, rem) : 5;

            // =================================================================
            // 5. VOICE DICTATION & GEMINI AI TIPS (3-5 WORDS EACH)
            // =================================================================
            async function toggleMic() {
                if (isRecording) await stopMic();
                else await startMic();
            }

            async function startMic() {
                const micBtn = document.getElementById('btn-mic');
                const topicInput = document.getElementById('ai-topic-input');
                speechText = '';
                speechFailed = false;
                audioChunks = [];

                try {
                    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    }
                } catch (e) {
                    if (topicInput) topicInput.placeholder = 'Mic blocked — type topic here...';
                    return;
                }

                isRecording = true;
                if (micBtn) {
                    micBtn.classList.add('mic-live', 'bg-rose-500/25', 'border-rose-400', 'text-rose-200');
                }

                if (mediaStream && typeof MediaRecorder !== 'undefined') {
                    try {
                        mediaRecorder = new MediaRecorder(mediaStream);
                        mediaRecorder.ondataavailable = (e) => {
                            if (e.data && e.data.size > 0) audioChunks.push(e.data);
                        };
                        mediaRecorder.start(250);
                    } catch (e) {
                        mediaRecorder = null;
                    }
                }

                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (SR) {
                    try {
                        recognition = new SR();
                        recognition.continuous = true;
                        recognition.interimResults = true;
                        recognition.lang = 'en-US';
                        recognition.onresult = (ev) => {
                            let finalPart = '';
                            let interimPart = '';
                            for (let i = ev.resultIndex; i < ev.results.length; i++) {
                                const txt = ev.results[i][0].transcript;
                                if (ev.results[i].isFinal) finalPart += txt;
                                else interimPart += txt;
                            }
                            if (finalPart) {
                                speechText = (speechText + ' ' + finalPart.trim()).trim();
                                state.topic = speechText;
                                if (topicInput) topicInput.value = speechText;
                                saveState();
                            } else if (interimPart && topicInput) {
                                topicInput.value = (speechText + ' ' + interimPart.trim()).trim();
                            }
                        };
                        recognition.onerror = () => { speechFailed = true; };
                        recognition.start();
                    } catch (e) {
                        speechFailed = true;
                    }
                } else {
                    speechFailed = true;
                }
            }

            async function stopMic() {
                isRecording = false;
                const micBtn = document.getElementById('btn-mic');
                if (micBtn) {
                    micBtn.classList.remove('mic-live', 'bg-rose-500/25', 'border-rose-400', 'text-rose-200');
                }

                if (recognition) {
                    try { recognition.stop(); } catch (e) {}
                    recognition = null;
                }

                let blob = null;
                if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                    blob = await new Promise((resolve) => {
                        const mime = mediaRecorder.mimeType || 'audio/webm';
                        mediaRecorder.onstop = () => resolve(audioChunks.length ? new Blob(audioChunks, { type: mime }) : null);
                        try { mediaRecorder.stop(); } catch (e) { resolve(null); }
                    });
                }
                mediaRecorder = null;

                if (mediaStream) {
                    mediaStream.getTracks().forEach(t => t.stop());
                    mediaStream = null;
                }

                if ((!speechText || speechFailed) && blob && blob.size > 0) {
                    const topicInput = document.getElementById('ai-topic-input');
                    if (topicInput) topicInput.placeholder = 'Transcribing...';
                    const transcribed = await transcribeWithGemini(blob);
                    if (transcribed) {
                        state.topic = transcribed;
                        if (topicInput) topicInput.value = transcribed;
                        saveState();
                    }
                    if (topicInput) topicInput.placeholder = 'Lesson topic...';
                }

                if (state.topic.trim()) {
                    generateAITips();
                }
            }

            async function transcribeWithGemini(blob) {
                try {
                    const base64 = await new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onloadend = () => resolve(String(reader.result || '').split(',')[1] || '');
                        reader.onerror = reject;
                        reader.readAsDataURL(blob);
                    });
                    const mime = (blob.type || 'audio/webm').split(';')[0];
                    const apiKey = '';
                    const url = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=' + apiKey;

                    const res = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{
                                role: 'user',
                                parts: [
                                    { text: 'Transcribe this teacher lesson topic into plain text only.' },
                                    { inlineData: { mimeType: mime, data: base64 } }
                                ]
                            }]
                        })
                    });
                    if (res.ok) {
                        const data = await res.json();
                        return data?.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || '';
                    }
                } catch (e) {}
                return '';
            }

            async function generateAITips() {
                if (!state.segments.length) return;
                const btn = document.getElementById('btn-ai-tips');
                const label = document.getElementById('ai-label');
                if (btn) btn.disabled = true;
                if (label) label.textContent = '...';

                const topic = state.topic.trim() || 'Classroom focus activity';
                const phases = state.segments.map((s, idx) => ({ idx, title: s.title, mins: s.minutes }));

                const apiKey = '';
                const url = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=' + apiKey;

                let success = false;
                try {
                    const res = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{
                                parts: [{
                                    text: 'Lesson topic: "' + topic + '". Phases: ' + JSON.stringify(phases) +
                                        '. Return 3 ultra-concise student executive-function action steps (3-5 words max each) per phase.'
                                }]
                            }],
                            generationConfig: {
                                responseMimeType: 'application/json',
                                responseSchema: {
                                    type: 'ARRAY',
                                    items: {
                                        type: 'OBJECT',
                                        properties: {
                                            idx: { type: 'INTEGER' },
                                            tips: { type: 'ARRAY', items: { type: 'STRING' } }
                                        },
                                        required: ['idx', 'tips']
                                    }
                                }
                            }
                        })
                    });

                    if (res.ok) {
                        const data = await res.json();
                        const raw = data?.candidates?.[0]?.content?.parts?.[0]?.text;
                        const parsed = raw ? JSON.parse(raw) : null;
                        if (Array.isArray(parsed)) {
                            parsed.forEach(item => {
                                if (state.segments[item.idx] && Array.isArray(item.tips) && item.tips.length) {
                                    state.segments[item.idx].tips = item.tips.map(t => String(t).trim()).filter(Boolean).slice(0, 4);
                                }
                            });
                            success = true;
                        }
                    }
                } catch (e) {}

                if (!success) {
                    state.segments.forEach(seg => {
                        const t = seg.title.toLowerCase();
                        if (t.includes('plan') || t.includes('outline')) {
                            seg.tips = ['Read prompt carefully', 'Outline 3 key ideas', 'Check needed materials'];
                        } else if (t.includes('draft') || t.includes('work') || t.includes('write')) {
                            seg.tips = ['Start task right away', 'Keep quiet focus', 'Pace with pie clock'];
                        } else if (t.includes('check') || t.includes('review') || t.includes('wrap')) {
                            seg.tips = ['Verify all requirements', 'Share with partner', 'Tidy workspace neatly'];
                        } else {
                            seg.tips = ['Begin ' + seg.title, 'Follow board steps', 'Stay on pace'];
                        }
                    });
                }

                state.checked = {};
                saveState();
                renderSetup();
                lastBroadcastHash = '';
                updateBroadcastHUD();

                if (btn) btn.disabled = false;
                if (label) label.textContent = 'AI Tips';
            }

            // =================================================================
            // 6. ROUND PIE-CHART SVG CLOCK & MINI PREVIEW
            // =================================================================
            function polarToXY(cx, cy, r, deg) {
                const rad = ((deg - 90) * Math.PI) / 180;
                return {
                    x: Number((cx + r * Math.cos(rad)).toFixed(2)),
                    y: Number((cy + r * Math.sin(rad)).toFixed(2))
                };
            }

            function pieWedgeSvg(cx, cy, r, startDeg, endDeg, fill, attrs) {
                const sweep = endDeg - startDeg;
                if (sweep <= 0.02) return '';
                if (sweep >= 359.8) {
                    return '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + fill + '" ' + (attrs || '') + '/>';
                }
                const s = polarToXY(cx, cy, r, startDeg);
                const e = polarToXY(cx, cy, r, endDeg);
                const large = sweep > 180 ? 1 : 0;
                return '<path d="M ' + cx + ' ' + cy + ' L ' + s.x + ' ' + s.y + ' A ' + r + ' ' + r + ' 0 ' + large + ' 1 ' + e.x + ' ' + e.y + ' Z" fill="' + fill + '" ' + (attrs || '') + '/>';
            }

            function renderMiniPie() {
                const svg = document.getElementById('mini-pie-svg');
                if (!svg) return;
                const scale = Math.max(1, state.totalMinutes, getAllocatedMinutes());
                let deg = 0;
                let out = '<circle cx="50" cy="50" r="46" fill="#0F172A"/>';
                const divs = [];

                state.segments.forEach(seg => {
                    const sweep = Math.min(360 - deg, (Math.max(0, seg.minutes) / scale) * 360);
                    if (sweep <= 0) return;
                    out += pieWedgeSvg(50, 50, 46, deg, deg + sweep, seg.color, 'fill-opacity="0.92"');
                    if (sweep < 359.8) divs.push(deg);
                    deg += sweep;
                });
                if (deg > 0.1 && deg < 359.8) divs.push(deg);

                divs.forEach(a => {
                    const p = polarToXY(50, 50, 46, a);
                    out += '<line x1="50" y1="50" x2="' + p.x + '" y2="' + p.y + '" stroke="#050811" stroke-width="2"/>';
                });
                out += '<circle cx="50" cy="50" r="11" fill="#050811" stroke="#00E5FF" stroke-width="1.2"/>';
                svg.innerHTML = out;
            }

            function renderClock() {
                renderMiniPie();
                const wedgesEl = document.getElementById('wedges-layer');
                const dividersEl = document.getElementById('dividers-layer');
                const labelsEl = document.getElementById('labels-layer');
                const ticksEl = document.getElementById('ticks-layer');
                if (!wedgesEl || !dividersEl || !labelsEl || !ticksEl) return;

                const cx = 250, cy = 250, r = 195;
                const scale = Math.max(1, state.totalMinutes, getAllocatedMinutes());
                let deg = 0;
                let wedges = '';
                let dividers = '';
                let labels = '';
                const divAngles = [];

                state.segments.forEach((seg, idx) => {
                    const sweep = Math.min(360 - deg, (Math.max(0, seg.minutes) / scale) * 360);
                    if (sweep <= 0) return;

                    wedges += pieWedgeSvg(cx, cy, r, deg, deg + sweep, seg.color, 'fill-opacity="0.88"');
                    if (sweep < 359.8) divAngles.push(deg);

                    if (sweep >= 16) {
                        const mid = deg + sweep / 2;
                        const pt = polarToXY(cx, cy, 122, mid);
                        if (seg.imageUrl) {
                            const sz = sweep >= 36 ? 40 : 28;
                            const half = sz / 2;
                            labels +=
                                '<g transform="translate(' + pt.x + ',' + pt.y + ')" class="pointer-events-none">' +
                                '<defs><clipPath id="cp_' + idx + '"><circle cx="0" cy="0" r="' + half + '"/></clipPath></defs>' +
                                '<circle cx="0" cy="0" r="' + (half + 2.5) + '" fill="#050811" stroke="#00E5FF" stroke-width="1.8"/>' +
                                '<image href="' + seg.imageUrl + '" x="' + (-half) + '" y="' + (-half) + '" width="' + sz + '" height="' + sz + '" clip-path="url(#cp_' + idx + ')" preserveAspectRatio="xMidYMid slice"/>' +
                                '</g>';
                        } else {
                            const fz = sweep >= 36 ? 28 : 20;
                            const br = sweep >= 36 ? 22 : 15;
                            labels +=
                                '<g transform="translate(' + pt.x + ',' + pt.y + ')" class="pointer-events-none">' +
                                '<circle cx="0" cy="0" r="' + br + '" fill="rgba(5,8,17,0.78)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>' +
                                '<text x="0" y="1" text-anchor="middle" dominant-baseline="central" style="font-size:' + fz + 'px">' + esc(seg.icon) + '</text>' +
                                '</g>';
                        }
                    }

                    deg += sweep;
                });

                if (deg < 359.8) {
                    wedges += pieWedgeSvg(cx, cy, r, deg, 360, '#131C31', '');
                    if (deg > 0.1) divAngles.push(deg);
                }

                divAngles.forEach(a => {
                    const p = polarToXY(cx, cy, r, a);
                    dividers += '<line x1="250" y1="250" x2="' + p.x + '" y2="' + p.y + '" stroke="#050811" stroke-width="4" stroke-linecap="round"/>';
                });

                wedgesEl.innerHTML = wedges;
                dividersEl.innerHTML = dividers;
                labelsEl.innerHTML = labels;

                // Ticks & 5-minute numbers
                let ticks = '';
                const step = scale <= 15 ? 1 : scale <= 75 ? 5 : 10;
                for (let m = 0; m < scale; m++) {
                    const a = (m / scale) * 360;
                    const major = m % step === 0;
                    const p1 = polarToXY(cx, cy, major ? 196 : 197, a);
                    const p2 = polarToXY(cx, cy, major ? 206 : 202, a);
                    ticks += '<line x1="' + p1.x + '" y1="' + p1.y + '" x2="' + p2.x + '" y2="' + p2.y + '" stroke="' + (major ? '#00E5FF' : '#334155') + '" stroke-width="' + (major ? 2.4 : 1.2) + '"/>';
                    if (major) {
                        const np = polarToXY(cx, cy, 221, a);
                        ticks += '<text x="' + np.x + '" y="' + np.y + '" text-anchor="middle" dominant-baseline="central" class="font-mono font-extrabold ' + (m === 0 ? 'fill-cyan-300' : 'fill-slate-300') + '" style="font-size:13.5px">' + (m === 0 ? scale : m) + '</text>';
                    }
                }
                ticksEl.innerHTML = ticks;
                updateClockHand();
            }

            function updateClockHand() {
                const totalSec = getTotalSeconds();
                const clamped = Math.min(totalSec, Math.max(0, state.elapsedSeconds));
                const deg = (clamped / totalSec) * 360;

                const hand = document.getElementById('hand-layer');
                const elapsed = document.getElementById('elapsed-layer');
                if (hand) hand.setAttribute('transform', 'rotate(' + deg + ', 250, 250)');
                if (elapsed) {
                    if (deg > 0.1) {
                        const fill = state.sweepMode === 'vanish' ? '#070C18' : '#050811';
                        const op = state.sweepMode === 'vanish' ? '0.96' : '0.34';
                        elapsed.innerHTML = pieWedgeSvg(250, 250, 195, 0, deg, fill, 'fill-opacity="' + op + '"');
                    } else {
                        elapsed.innerHTML = '';
                    }
                }
            }

            // =================================================================
            // 7. BROADCAST MODE, TIMER & AUDIO CHIMES
            // =================================================================
            function enterBroadcast() {
                document.getElementById('setup-view').classList.add('hidden');
                const bv = document.getElementById('broadcast-view');
                bv.classList.remove('hidden');
                bv.classList.add('flex');
                renderClock();
                lastBroadcastHash = '';
                updateBroadcastHUD();
                try {
                    if (document.documentElement.requestFullscreen && !document.fullscreenElement) {
                        document.documentElement.requestFullscreen().catch(() => {});
                    }
                } catch (e) {}
            }

            function exitBroadcast() {
                const bv = document.getElementById('broadcast-view');
                bv.classList.add('hidden');
                bv.classList.remove('flex');
                document.getElementById('setup-view').classList.remove('hidden');
                try {
                    if (document.fullscreenElement && document.exitFullscreen) {
                        document.exitFullscreen().catch(() => {});
                    }
                } catch (e) {}
            }

            function getTotalSeconds() {
                return Math.max(1, state.totalMinutes, getAllocatedMinutes()) * 60;
            }

            function getActiveSegment() {
                let acc = 0;
                for (let i = 0; i < state.segments.length; i++) {
                    const dur = Math.max(0, Number(state.segments[i].minutes) || 0) * 60;
                    if (state.elapsedSeconds < acc + dur) {
                        return { index: i, seg: state.segments[i], remSec: (acc + dur) - state.elapsedSeconds };
                    }
                    acc += dur;
                }
                return { index: -1, seg: null, remSec: Math.max(0, getTotalSeconds() - state.elapsedSeconds) };
            }

            function togglePlay() {
                if (state.isRunning) {
                    state.isRunning = false;
                    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
                } else {
                    if (state.elapsedSeconds >= getTotalSeconds()) state.elapsedSeconds = 0;
                    state.isRunning = true;
                    state.lastTick = performance.now();
                    rafId = requestAnimationFrame(tick);
                }
                updatePlayDock();
            }

            function resetTimer() {
                state.isRunning = false;
                if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
                state.elapsedSeconds = 0;
                updatePlayDock();
                updateClockHand();
                lastBroadcastHash = '';
                updateBroadcastHUD();
            }

            function adjustElapsed(deltaSec) {
                const maxSec = getTotalSeconds();
                state.elapsedSeconds = Math.min(maxSec, Math.max(0, state.elapsedSeconds + deltaSec));
                if (state.elapsedSeconds >= maxSec && state.isRunning) {
                    state.isRunning = false;
                    playChime(true, false);
                }
                updatePlayDock();
                updateClockHand();
                lastBroadcastHash = '';
                updateBroadcastHUD();
            }

            function nextPhase() {
                const cur = getActiveSegment();
                if (cur.index !== -1 && cur.index + 1 < state.segments.length) {
                    let start = 0;
                    for (let i = 0; i <= cur.index; i++) start += state.segments[i].minutes * 60;
                    state.elapsedSeconds = start;
                    if (state.isRunning) state.lastTick = performance.now();
                    playChime(false, false);
                } else {
                    state.elapsedSeconds = getTotalSeconds();
                    state.isRunning = false;
                    playChime(true, false);
                }
                updatePlayDock();
                updateClockHand();
                lastBroadcastHash = '';
                updateBroadcastHUD();
            }

            function tick(now) {
                if (!state.isRunning) return;
                const dt = Math.max(0, (now - state.lastTick) / 1000);
                state.lastTick = now;

                const prevIdx = getActiveSegment().index;
                state.elapsedSeconds += dt;
                const maxSec = getTotalSeconds();

                if (state.elapsedSeconds >= maxSec) {
                    state.elapsedSeconds = maxSec;
                    state.isRunning = false;
                    updatePlayDock();
                    playChime(true, false);
                } else {
                    const nextIdx = getActiveSegment().index;
                    if (nextIdx !== prevIdx && nextIdx !== -1) {
                        playChime(false, false);
                    }
                }

                updateClockHand();
                updateBroadcastHUD();
                if (state.isRunning) rafId = requestAnimationFrame(tick);
            }

            function toggleSweepMode() {
                state.sweepMode = state.sweepMode === 'full' ? 'vanish' : 'full';
                const pill = document.getElementById('btn-sweep-pill');
                if (pill) {
                    pill.innerHTML = state.sweepMode === 'full' ? '&#9684; Full Pie' : '&#9685; Disappearing Pie';
                }
                saveState();
                updateClockHand();
            }

            function toggleSound() {
                state.muted = !state.muted;
                const btn = document.getElementById('dock-sound');
                if (btn) btn.textContent = state.muted ? 'Muted' : 'Sound';
                saveState();
            }

            function updatePlayDock() {
                const btn = document.getElementById('dock-play');
                if (!btn) return;
                btn.textContent = state.isRunning ? 'Pause' : 'Start';
                btn.className = state.isRunning
                    ? 'px-6 py-2.5 rounded-xl bg-gradient-to-r from-amber-400 to-orange-500 text-dojo-950 font-display font-black text-xs sm:text-sm uppercase tracking-wider min-w-[120px] transition active:scale-95'
                    : 'px-6 py-2.5 rounded-xl bg-gradient-to-r from-emerald-400 to-cyan-400 text-dojo-950 font-display font-black text-xs sm:text-sm uppercase tracking-wider min-w-[120px] transition active:scale-95';
            }

            function updateBroadcastHUD() {
                const totalRem = Math.max(0, Math.ceil(getTotalSeconds() - state.elapsedSeconds));
                const active = getActiveSegment();
                const displaySec = totalRem === 0 ? 0 : (active.seg ? Math.ceil(active.remSec) : totalRem);
                const formatted = fmtTime(displaySec);

                const cdEl = document.getElementById('bc-countdown');
                const hubEl = document.getElementById('hub-time');
                if (cdEl) cdEl.textContent = formatted;
                if (hubEl) hubEl.textContent = formatted;

                const hash = [
                    totalRem === 0 ? 'done' : active.index,
                    active.seg ? (active.seg.title + active.seg.color + active.seg.icon + JSON.stringify(active.seg.tips)) : 'none'
                ].join('|');

                if (hash === lastBroadcastHash) return;
                lastBroadcastHash = hash;

                const iconEl = document.getElementById('bc-icon');
                const pillEl = document.getElementById('bc-pill');
                const titleEl = document.getElementById('bc-title');
                const listEl = document.getElementById('bc-do-now-list');

                if (totalRem === 0) {
                    if (iconEl) iconEl.innerHTML = '&#127942;';
                    if (pillEl) pillEl.textContent = 'DONE';
                    if (titleEl) titleEl.textContent = 'Complete!';
                    if (listEl) listEl.innerHTML = '<li class="p-4 rounded-2xl bg-dojo-950 border border-emerald-400/40 text-2xl sm:text-3xl font-bold text-emerald-300">&#10003; All phases finished</li>';
                } else if (active.seg) {
                    const s = active.seg;
                    if (iconEl) {
                        iconEl.innerHTML = '';
                        if (s.imageUrl) {
                            const img = document.createElement('img');
                            img.src = s.imageUrl;
                            img.className = 'w-full h-full object-cover';
                            iconEl.appendChild(img);
                        } else {
                            iconEl.textContent = s.icon;
                        }
                        iconEl.style.borderColor = s.color;
                    }
                    if (pillEl) {
                        pillEl.textContent = (active.index + 1) + ' / ' + state.segments.length;
                        pillEl.style.color = s.color;
                    }
                    if (titleEl) titleEl.textContent = s.title;

                    if (listEl) {
                        listEl.innerHTML = '';
                        (s.tips || []).forEach((tip, i) => {
                            const key = s.id + ':' + i;
                            const done = Boolean(state.checked[key]);
                            const li = document.createElement('li');
                            li.className = 'p-4 rounded-2xl bg-dojo-950 border transition cursor-pointer flex items-center gap-4 select-none ' +
                                (done ? 'border-emerald-400/40 opacity-55' : 'border-slate-800 hover:border-cyan-400/40');

                            const badge = document.createElement('span');
                            badge.className = 'w-9 h-9 rounded-xl font-mono font-extrabold text-base flex items-center justify-center shrink-0';
                            badge.style.backgroundColor = done ? '#00E676' : s.color;
                            badge.style.color = '#050811';
                            badge.innerHTML = done ? '&#10003;' : String(i + 1);

                            const txt = document.createElement('span');
                            txt.className = 'text-2xl sm:text-3xl font-bold leading-snug ' + (done ? 'line-through text-slate-400' : 'text-white');
                            txt.textContent = tip;

                            li.appendChild(badge);
                            li.appendChild(txt);
                            li.addEventListener('click', () => {
                                state.checked[key] = !state.checked[key];
                                lastBroadcastHash = '';
                                updateBroadcastHUD();
                            });
                            listEl.appendChild(li);
                        });
                    }
                } else {
                    if (iconEl) iconEl.innerHTML = '&#127775;';
                    if (pillEl) pillEl.textContent = 'FREE';
                    if (titleEl) titleEl.textContent = 'Wrap-Up';
                    if (listEl) listEl.innerHTML = '<li class="p-4 rounded-2xl bg-dojo-950 border border-slate-800 text-2xl sm:text-3xl font-bold text-slate-200">Finish &amp; tidy desk</li>';
                }

                // NEXT Strip
                const nIcon = document.getElementById('bc-next-icon');
                const nTitle = document.getElementById('bc-next-title');
                const nMins = document.getElementById('bc-next-mins');
                const nextIdx = active.index !== -1 ? active.index + 1 : -1;

                if (nextIdx !== -1 && nextIdx < state.segments.length && totalRem > 0) {
                    const nxt = state.segments[nextIdx];
                    if (nIcon) nIcon.textContent = nxt.icon;
                    if (nTitle) nTitle.textContent = nxt.title;
                    if (nMins) nMins.textContent = nxt.minutes + 'm';
                } else {
                    if (nIcon) nIcon.innerHTML = '&#127937;';
                    if (nTitle) nTitle.textContent = 'Finish';
                    if (nMins) nMins.textContent = '';
                }
            }

            function playChime(isDone, ignoreMute) {
                const overlay = document.getElementById('flash-overlay');
                if (overlay) {
                    overlay.classList.remove('flash-cue');
                    void overlay.offsetWidth;
                    overlay.classList.add('flash-cue');
                }

                if (state.chime === 'Silent') return;
                if (state.muted && !ignoreMute) return;

                try {
                    const AC = window.AudioContext || window.webkitAudioContext;
                    if (!AC) return;
                    if (!audioCtx) audioCtx = new AC();
                    if (audioCtx.state === 'suspended') audioCtx.resume();
                    const now = audioCtx.currentTime;

                    const freqs = isDone
                        ? [523.25, 659.25, 783.99, 1046.5]
                        : state.chime === 'Cyber' ? [783.99, 1174.66]
                        : state.chime === 'Triad' ? [523.25, 659.25, 783.99]
                        : state.chime === 'Bowl' ? [432, 648]
                        : [293.66, 587.33];

                    freqs.forEach((f, idx) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = state.chime === 'Gong' ? 'triangle' : 'sine';
                        osc.frequency.setValueAtTime(f, now + idx * 0.12);
                        gain.gain.setValueAtTime(0.001, now + idx * 0.12);
                        gain.gain.exponentialRampToValueAtTime(0.16, now + idx * 0.12 + 0.02);
                        gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.12 + 1.1);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(now + idx * 0.12);
                        osc.stop(now + idx * 0.12 + 1.15);
                    });
                } catch (e) {}
            }

            // =================================================================
            // 8. EMOJI (42) & PHOTO MODAL
            // =================================================================
            function buildEmojiModal() {
                const box = document.getElementById('emoji-categories-box');
                if (!box) return;
                box.innerHTML = '';

                EMOJI_GROUPS.forEach(group => {
                    const wrap = document.createElement('div');
                    wrap.className = 'flex flex-col gap-1';

                    const lbl = document.createElement('span');
                    lbl.className = 'text-[10px] font-display font-bold uppercase tracking-widest text-cyan-400/80';
                    lbl.textContent = group.name;

                    const grid = document.createElement('div');
                    grid.className = 'grid grid-cols-6 gap-1.5';

                    group.items.forEach(em => {
                        const b = document.createElement('button');
                        b.type = 'button';
                        b.textContent = em;
                        b.className = 'h-9 rounded-xl bg-dojo-950 hover:bg-cyan-500/20 border border-slate-800 hover:border-cyan-400 text-lg flex items-center justify-center transition';
                        b.addEventListener('click', () => applySegmentIcon(em, null));
                        grid.appendChild(b);
                    });

                    wrap.appendChild(lbl);
                    wrap.appendChild(grid);
                    box.appendChild(wrap);
                });
            }

            function openEmojiModal(segId) {
                activeModalSegId = segId;
                const modal = document.getElementById('emoji-modal');
                if (modal) {
                    modal.classList.remove('hidden');
                    modal.classList.add('flex');
                }
            }

            function closeEmojiModal() {
                activeModalSegId = null;
                const modal = document.getElementById('emoji-modal');
                if (modal) {
                    modal.classList.add('hidden');
                    modal.classList.remove('flex');
                }
            }

            function applySegmentIcon(icon, imageUrl) {
                const seg = state.segments.find(s => s.id === activeModalSegId);
                if (seg) {
                    seg.icon = icon;
                    seg.imageUrl = imageUrl;
                    saveState();
                    renderSetup();
                    renderClock();
                    lastBroadcastHash = '';
                    updateBroadcastHUD();
                }
                closeEmojiModal();
            }

            function handlePhotoUpload(e) {
                const file = e.target?.files?.[0];
                if (!file || !activeModalSegId) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    if (ev.target?.result) applySegmentIcon('🖼️', ev.target.result);
                };
                reader.readAsDataURL(file);
                e.target.value = '';
            }

            // =================================================================
            // 9. HELPERS
            // =================================================================
            function fmtTime(sec) {
                const s = Math.max(0, Math.floor(sec));
                return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
            }

            function esc(str) {
                return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            }
        })();
    </script>
